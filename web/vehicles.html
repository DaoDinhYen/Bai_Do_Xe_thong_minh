<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phương tiện — Smart Parking</title>

<script>
(function init() {

                  <span>📡 Quét thẻ</span>
                </button>
              </div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:24px;border-top:1px solid #F1F5F9;padding-top:18px">
              <button type="button" class="btn btn-ghost" onclick="closeAddVehicleModal()" style="font-weight:600">Hủy</button>
              <button type="submit" class="btn btn-primary" id="btn-submit-add-vehicle" style="font-weight:600;box-shadow:0 4px 12px rgba(37,99,235,0.25)">Lưu phương tiện</button>

    </div>

    <!-- Edit Vehicle Modal -->
    <div id="edit-vehicle-modal" class="modal-overlay">
      <div class="modal" style="max-width:520px;border-radius:18px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.18)">
        <div class="modal-header" style="background:#F8FAFC;padding:18px 24px;border-bottom:1px solid #E2E8F0">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:#EFF6FF;color:#2563EB;display:flex;align-items:center;justify-content:center;font-size:18px">✏️</div>
            <div>
              <span class="modal-title" style="font-size:16px;font-weight:700;color:#0F172A">Chỉnh sửa phương tiện</span>
              <div style="font-size:12px;color:#64748B">Sửa biển số xe và gán lại mã thẻ RFID thực tế</div>

          <button class="modal-close" onclick="closeEditVehicleModal()">✕</button>

                <select class="filter-select" id="edit-v-type" style="width:100%;height:42px;border-radius:10px;border:1px solid #E2E8F0;font-weight:500">
                  <option value="CAR">Ô tô (CAR)</option>

                  <option value="TRUCK">Xe tải (TRUCK)</option>

                <button type="button" class="btn btn-outline" id="btn-scan-rfid-edit" onclick="listenForRfid('edit-v-rfid', this)" style="border-radius:10px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600">
                  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
                  <span>📡 Quét thẻ</span>
                </button>

  createAdminPage('vehicles', content, () => {
    loadVehicles(1);
    loadRfid();
    loadUsersDropdown();
    window.debouncedSearchV = debounce(() => loadVehicles(1), 400);
  });
})();

let currentVehicleId = null;

function resetVehicleFilters() {
  const s = document.getElementById('v-search');
  const t = document.getElementById('v-type');
  const r = document.getElementById('v-rfid');
  const sort = document.getElementById('v-sort');
  if (s) s.value = '';
  if (t) t.value = '';
  if (r) r.value = '';
  if (sort) sort.value = 'created_at:desc';
  loadVehicles(1);
}

async function loadUsersDropdown() {
  try {
    const res = await UserAPI.getAll({ limit: 100 });
    const users = Array.isArray(res?.data) ? res.data : (res?.data?.data || []);
    const select = document.getElementById('new-v-owner');
    if (!select) return;
    if (!users.length) {
      select.innerHTML = '<option value="">Chưa có người dùng</option>';
      return;
    }
    select.innerHTML = users.map(u => `<option value="${u.id}">${u.name} (${u.email || u.phone || '#' + u.id})</option>`).join('');
  } catch {}
}

async function loadVehicles(page = 1) {
  const search = document.getElementById('v-search')?.value || '';
  const vehicle_type = document.getElementById('v-type')?.value || '';
  const has_rfid = document.getElementById('v-rfid')?.value || '';
  const sortVal = document.getElementById('v-sort')?.value || 'created_at:desc';
  const [sort_by, sort_order] = sortVal.split(':');

  const tbody  = document.getElementById('vehicle-table');
  if (tbody) tbody.innerHTML = skeletonRows(7);

  try {
    const params = { page, limit: 15, search, sort_by, sort_order };
    if (vehicle_type) params.vehicle_type = vehicle_type;
    if (has_rfid) params.has_rfid = has_rfid;

    const res = await VehicleAPI.getAll(params);
    const data = Array.isArray(res?.data) ? res.data : (res?.data?.data || []);
    const total = res?.pagination?.total ?? res?.total ?? data.length;

    if (!tbody) return;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state" style="padding:40px;text-align:center"><div class="empty-state-icon" style="font-size:36px;margin-bottom:8px">🚗</div><div class="empty-state-title" style="font-size:15px;font-weight:600;color:#64748B">Không tìm thấy phương tiện nào</div></div></td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(v => {
      const typeBadge = v.vehicle_type === 'CAR'
        ? `<span class="badge badge-primary" style="display:inline-flex;align-items:center;gap:4px">🚗 Ô tô</span>`
        : v.vehicle_type === 'MOTORBIKE'
        ? `<span class="badge badge-success" style="display:inline-flex;align-items:center;gap:4px">🏍️ Xe máy</span>`
        : `<span class="badge badge-warning" style="display:inline-flex;align-items:center;gap:4px">🚚 Xe tải</span>`;

      return `
        <tr style="border-bottom:1px solid #F1F5F9;transition:background 0.15s ease">
          <td style="padding:14px 18px">
            <span class="vn-plate" style="font-size:13px;font-weight:800;letter-spacing:1px">${v.plate_number || '—'}</span>
          </td>
          <td style="padding:14px 18px">
            <div style="font-weight:600;color:#0F172A">${v.owner_name || v.user_name || '—'}</div>
            <div style="font-size:12px;color:#64748B">${v.owner_email || v.email || ''}</div>
          </td>
          <td style="padding:14px 18px">
            ${typeBadge}
          </td>
          <td style="padding:14px 18px;font-size:13px;color:#334155">
            <span style="font-weight:500">${v.vehicle_name || '—'}</span>
            ${v.color ? `<span style="font-size:12px;color:#94A3B8;margin-left:4px">(${v.color})</span>` : ''}
          </td>
          <td style="padding:14px 18px">
            ${v.rfid_uid 
              ? `<code style="font-family:'JetBrains Mono',monospace;font-size:12px;background:#F0FDFA;color:#0D9488;padding:3px 8px;border-radius:6px;border:1px solid rgba(13,148,136,0.2);font-weight:600">${v.rfid_uid}</code>` 
              : '<span style="color:#94A3B8;font-size:12px;font-style:italic">Chưa gắn thẻ</span>'}
          </td>
          <td style="padding:14px 18px">
            ${v.is_default ? '<span class="badge badge-success" style="font-weight:600">✓ Mặc định</span>' : '<span style="color:#CBD5E1">—</span>'}
          </td>
          <td style="padding:14px 18px;font-size:12px;color:#64748B;white-space:nowrap">${Format.date(v.created_at)}</td>
          <td style="padding:14px 18px;text-align:right">
            <div style="display:inline-flex;gap:6px">
              <button class="btn btn-sm btn-ghost" onclick="viewVehicle(${v.id})" style="border-radius:8px;font-weight:600">Chi tiết</button>
              <button class="btn btn-sm btn-error" onclick="deleteVehicleAction(${v.id}, '${v.plate_number}')" style="border-radius:8px;font-weight:600">Xóa</button>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    new Pagination({ container: 'vehicle-pager', total, page, limit: 15, onChange: loadVehicles }).render();
  } catch (err) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--error);padding:24px">Lỗi: ${err.message}</td></tr>`;
  }
}

async function loadRfid() {
  const tbody = document.getElementById('rfid-table');
  if (tbody) tbody.innerHTML = skeletonRows(4);
  try {
    const res = await RfidAPI.getAll({ page: 1, limit: 20 });
    const data = res?.data?.data || res?.data || [];

    if (!tbody) return;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#64748B;padding:24px">Chưa có thẻ RFID nào được ghi nhận</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(r => `
      <tr style="border-bottom:1px solid #F1F5F9">
        <td style="padding:14px 18px">
          <code style="font-family:'JetBrains Mono',monospace;font-size:12px;background:#F8FAFC;border:1px solid #E2E8F0;padding:3px 8px;border-radius:6px;font-weight:600;color:#0F172A">${r.rfid_uid || '—'}</code>
        </td>
        <td style="padding:14px 18px;font-weight:500;color:#0F172A">${r.user_name || r.owner_name || '—'}</td>
        <td style="padding:14px 18px">
          ${r.plate_number 
            ? `<span class="vn-plate" style="font-size:12px;padding:2px 8px">${r.plate_number}</span>` 
            : '<span style="color:#94A3B8;font-size:12px;font-style:italic">Chưa liên kết</span>'}
        </td>
        <td style="padding:14px 18px">
          ${r.status === 'ACTIVE' 
            ? '<span class="badge badge-success" style="font-weight:600">Hoạt động</span>' 
            : '<span class="badge badge-error" style="font-weight:600">Vô hiệu</span>'}
        </td>
        <td style="padding:14px 18px;font-size:12px;color:#64748B;white-space:nowrap">${Format.datetime(r.registered_at || r.created_at)}</td>
        <td style="padding:14px 18px;text-align:right">
          ${r.status === 'ACTIVE'
            ? `<button class="btn btn-sm btn-error" onclick="setRfidStatus(${r.id},'DISABLED')" style="border-radius:8px;font-weight:600">Vô hiệu hóa</button>`
            : `<button class="btn btn-sm btn-success" onclick="setRfidStatus(${r.id},'ACTIVE')" style="border-radius:8px;font-weight:600">Kích hoạt</button>`
          }
        </td>
      </tr>
    `).join('');
  } catch {}
}

async function setRfidStatus(id, status) {
  const ok = await showConfirm({ 
    title: `${status === 'ACTIVE' ? 'Kích hoạt' : 'Vô hiệu hóa'} thẻ RFID`, 
    message: `Xác nhận thay đổi trạng thái thẻ RFID?`, 
    confirmText: 'Xác nhận' 
  });
  if (!ok) return;
  try {
    await RfidAPI.setStatus(id, status);
    Toast.success('Thành công', `Đã cập nhật trạng thái thẻ RFID`);
    loadRfid();
  } catch (e) { Toast.error('Lỗi', e.message); }
}

async function viewVehicle(id) {
  currentVehicleId = id;
  const modal = document.getElementById('vehicle-modal');
  const body = document.getElementById('vehicle-modal-body');
  const actions = document.getElementById('vehicle-modal-actions');
  if (!modal || !body) return;
  body.innerHTML = `<div class="text-center p-4"><div class="spinner spinner-primary spinner-lg" style="margin:0 auto"></div></div>`;
  if (actions) actions.innerHTML = '';
  modal.classList.add('open');

  try {
    const res = await VehicleAPI.getById(id);
    const v = res?.data || {};

    body.innerHTML = `
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:24px;padding:16px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px">
        <div style="width:54px;height:54px;border-radius:12px;background:#FFF;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 6px rgba(0,0,0,0.04)">
          ${v.vehicle_type === 'CAR' ? '🚗' : v.vehicle_type === 'MOTORBIKE' ? '🏍️' : '🚚'}
        </div>
        <div>
          <div style="margin-bottom:6px">
            <span class="vn-plate" style="font-size:16px;font-weight:800;letter-spacing:1px;padding:4px 12px">${v.plate_number || '—'}</span>
          </div>
          <div style="font-size:14px;font-weight:600;color:#0F172A">${v.vehicle_name || 'Phương tiện'} ${v.color ? `<span style="font-weight:400;color:#64748B">(${v.color})</span>` : ''}</div>
          <div style="margin-top:6px;display:flex;gap:6px;align-items:center">
            <span class="badge ${v.vehicle_type === 'CAR' ? 'badge-primary' : 'badge-success'}">${Format.vehicleType(v.vehicle_type)}</span>
            ${v.is_default ? '<span class="badge badge-teal">Mặc định</span>' : ''}
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        ${[
          ['Chủ sở hữu', v.owner_name || v.user_name || '—'],
          ['Email chủ xe', v.owner_email || v.email || '—'],
          ['Điện thoại', v.owner_phone || v.phone || '—'],
          ['Mã thẻ RFID', v.rfid_uid ? `<code style="font-family:'JetBrains Mono',monospace;background:#F0FDFA;color:#0D9488;padding:2px 8px;border-radius:6px;border:1px solid rgba(13,148,136,0.2);font-weight:600">${v.rfid_uid}</code>` : '<span style="color:#94A3B8;font-style:italic">Chưa liên kết</span>'],
          ['Ngày đăng ký', Format.datetime(v.created_at)],
          ['Trạng thái', v.status === 'ACTIVE' ? '<span class="badge badge-success">Hoạt động</span>' : '<span class="badge badge-gray">Khóa</span>']
        ].map(([k,val]) => `
          <div style="background:#FFF;border:1px solid #F1F5F9;padding:12px 14px;border-radius:10px">
            <div style="font-size:11px;color:#64748B;font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px">${k}</div>
            <div style="font-size:13px;font-weight:600;color:#0F172A">${val}</div>
          </div>
        `).join('')}
      </div>
    `;

    if (actions) {
      actions.innerHTML = `
        <button class="btn btn-sm btn-primary" onclick="openEditVehicleModal(${v.id})" style="border-radius:8px;font-weight:600;display:flex;align-items:center;gap:6px">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Sửa xe</span>
        </button>
        <button class="btn btn-sm btn-error" onclick="deleteVehicleAction(${v.id}, '${v.plate_number}')" style="border-radius:8px;font-weight:600">
          Xóa xe
        </button>
      `;
    }
  } catch (err) {
    body.innerHTML = `<div style="text-align:center;color:var(--error);padding:20px">Không thể tải thông tin phương tiện: ${err.message}</div>`;
  }
}

function closeVehicleModal() {
  document.getElementById('vehicle-modal')?.classList.remove('open');
}

function openAddVehicleModal() {
  stopRfidListening();
  document.getElementById('add-vehicle-form')?.reset();
  loadUsersDropdown();
  document.getElementById('add-vehicle-modal')?.classList.add('open');
}

function closeAddVehicleModal() {
  stopRfidListening();
  document.getElementById('add-vehicle-modal')?.classList.remove('open');
}

async function openEditVehicleModal(id) {
  stopRfidListening();
  closeVehicleModal();
  try {
    const res = await VehicleAPI.getById(id);
    const v = res?.data || {};
    document.getElementById('edit-v-id').value = v.id;
    document.getElementById('edit-v-plate').value = v.plate_number || '';
    document.getElementById('edit-v-type').value = v.vehicle_type || 'CAR';
    document.getElementById('edit-v-owner-name').value = `${v.owner_name || v.user_name || 'Chủ xe'} (#${v.user_id})`;
    document.getElementById('edit-v-name').value = v.vehicle_name || '';
    document.getElementById('edit-v-color').value = v.color || '';
    document.getElementById('edit-v-rfid').value = v.rfid_uid || '';
    document.getElementById('edit-vehicle-modal')?.classList.add('open');
  } catch (err) {
    Toast.error('Lỗi', 'Không thể lấy thông tin xe để chỉnh sửa');
  }
}

function closeEditVehicleModal() {
  stopRfidListening();
  document.getElementById('edit-vehicle-modal')?.classList.remove('open');
}

async function submitEditVehicle(e) {
  e.preventDefault();
  const id = document.getElementById('edit-v-id')?.value;
  const plate_number = document.getElementById('edit-v-plate')?.value.trim();
  const vehicle_type = document.getElementById('edit-v-type')?.value;
  const vehicle_name = document.getElementById('edit-v-name')?.value.trim();
  const color = document.getElementById('edit-v-color')?.value.trim();
  const rfid_uid = document.getElementById('edit-v-rfid')?.value.trim() || null;

  if (!plate_number) {
    Toast.error('Lỗi', 'Biển số xe không được để trống');
    return;
  }

  const btn = document.getElementById('btn-submit-edit-vehicle');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu...'; }

  try {
    await VehicleAPI.update(id, { plate_number, vehicle_type, vehicle_name, color, rfid_uid });
    Toast.success('Thành công', `Đã cập nhật phương tiện ${plate_number}`);
    closeEditVehicleModal();
    loadVehicles(1);
    loadRfid();
  } catch (err) {
    Toast.error('Lỗi', err.message || 'Không thể cập nhật phương tiện');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Cập nhật thay đổi'; }
  }
}

async function submitAddVehicle(e) {
  e.preventDefault();
  const plate_number = document.getElementById('new-v-plate')?.value.trim();
  const vehicle_type = document.getElementById('new-v-type')?.value;
  const user_id = document.getElementById('new-v-owner')?.value;
  const vehicle_name = document.getElementById('new-v-name')?.value.trim();
  const color = document.getElementById('new-v-color')?.value.trim();
  const rfid_uid = document.getElementById('new-v-rfid')?.value.trim() || null;

  if (!plate_number || !user_id) {
    Toast.error('Lỗi', 'Vui lòng nhập biển số xe và chọn chủ sở hữu');
    return;
  }

  const btn = document.getElementById('btn-submit-add-vehicle');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu...'; }

  try {
    await VehicleAPI.create({ plate_number, vehicle_type, user_id, vehicle_name, color, rfid_uid });
    Toast.success('Thành công', `Đã thêm phương tiện ${plate_number}`);
    closeAddVehicleModal();
    loadVehicles(1);
    loadRfid();
  } catch (err) {
    Toast.error('Lỗi', err.message || 'Không thể thêm phương tiện');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Lưu phương tiện'; }
  }
}

async function deleteVehicleAction(id, plate) {
  const ok = await showConfirm({
    title: 'Xóa phương tiện',
    message: `Xác nhận xóa phương tiện biển số ${plate}? Hành động này không thể hoàn tác.`,
    confirmText: 'Xóa xe',
    danger: true
  });
  if (!ok) return;

  try {
    await VehicleAPI.delete(id);
    Toast.success('Thành công', `Đã xóa phương tiện ${plate}`);
    closeVehicleModal();
    loadVehicles(1);
  } catch (err) {
    Toast.error('Lỗi', err.message || 'Không thể xóa phương tiện');
  }
}

// ============================================================
// LOGIC QUÉT THẺ TỰ ĐỘNG TỪ ESP32 QUA SOCKET.IO
// ============================================================
let activeRfidSocket = null;
let activeListeningBtn = null;
let activeTargetInputId = null;

function listenForRfid(targetInputId, btn) {
  const input = document.getElementById(targetInputId);
  if (!input) return;

  // Nếu đang quét mà bấm lại -> Hủy
  if (activeListeningBtn === btn) {
    stopRfidListening();
    Toast.info('Đã dừng', 'Đã hủy chế độ chờ quẹt thẻ');
    return;
  }

  stopRfidListening();
  activeListeningBtn = btn;
  activeTargetInputId = targetInputId;

  btn.dataset.originalHtml = btn.innerHTML;
  btn.classList.remove('btn-outline');
  btn.classList.add('btn-warning');
  btn.style.background = '#FEF3C7';
  btn.style.color = '#B45309';
  btn.style.borderColor = '#F59E0B';
  btn.innerHTML = `<span class="spinner spinner-sm" style="margin-right:6px"></span><span>Quẹt thẻ vào ESP32...</span>`;

  input.placeholder = ">> Đang chờ quét thẻ vào đầu đọc RC522... <<";
  input.style.borderColor = "#F59E0B";
  input.style.boxShadow = "0 0 0 3px rgba(245, 158, 11, 0.25)";

  Toast.info('Sẵn sàng', 'Hãy quẹt thẻ từ vào đầu đọc RC522 của ESP32 để tự động điền mã!');

  if (!window.io) {
    Toast.error('Lỗi', 'Socket.IO chưa sẵn sàng');
    stopRfidListening();
    return;
  }

  if (!activeRfidSocket) {
    activeRfidSocket = io(window.SOCKET_URL || 'http://localhost:3000', {
      auth: { token: window.Auth?.getToken() }
    });
  }

  activeRfidSocket.off('rfid_event');
  activeRfidSocket.on('rfid_event', (data) => {
    const uid = data?.rfid_uid || data?.uid;
    if (uid) {
      const targetInput = document.getElementById(activeTargetInputId);
      if (targetInput) {
        targetInput.value = uid;
        targetInput.style.borderColor = "#10B981";
        targetInput.style.boxShadow = "0 0 0 3px rgba(16, 185, 129, 0.25)";
      }
      Toast.success('Đã đọc thẻ!', `Mã thẻ: ${uid} đã được tự động điền`);
      stopRfidListening();
    }
  });
}

function stopRfidListening() {
  if (activeListeningBtn) {
    if (activeListeningBtn.dataset.originalHtml) {
      activeListeningBtn.innerHTML = activeListeningBtn.dataset.originalHtml;
    }
    activeListeningBtn.classList.remove('btn-warning');
    activeListeningBtn.classList.add('btn-outline');
    activeListeningBtn.style.background = '';
    activeListeningBtn.style.color = '';
    activeListeningBtn.style.borderColor = '';
    activeListeningBtn = null;
  }
  if (activeTargetInputId) {
    const input = document.getElementById(activeTargetInputId);
    if (input) {
      input.placeholder = "Ví dụ: 56:62:69:03";
      input.style.borderColor = "";
      input.style.boxShadow = "";
    }
    activeTargetInputId = null;
  }
  if (activeRfidSocket) {
    activeRfidSocket.off('rfid_event');
  }
}
