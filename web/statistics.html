<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê — Smart Parking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-layout.js"></script>
<script>
(function init() {
  if (!requireAdmin()) return;
  const content = `
    <div class="page-header flex justify-between items-center">
      <div><div class="page-title">Thống kê</div><div class="page-subtitle">Phân tích doanh thu và hoạt động bãi xe</div></div>
      <div class="flex gap-2">
        <select class="filter-select" id="stat-period" onchange="loadStats(this.value)">
          <option value="7">7 ngày</option>
          <option value="30" selected>30 ngày</option>
          <option value="90">3 tháng</option>
        </select>
      </div>
    </div>

    <!-- KPI Cards -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px" class="stagger-children" id="kpi-cards">
      ${[1,2,3,4].map(() => `<div class="card card-body"><div class="skeleton" style="height:80px"></div></div>`).join('')}
    </div>

    <!-- Charts Row 1 -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Doanh thu theo ngày</span></div>
        <div style="padding:20px;height:260px"><canvas id="revenue-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Lượt xe theo giờ</span></div>
        <div style="padding:20px;height:260px"><canvas id="peak-chart"></canvas></div>
      </div>
    </div>

    <!-- Charts Row 2 -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Loại xe</span></div>
        <div style="padding:20px;height:240px;display:flex;align-items:center;justify-content:center"><canvas id="vehicle-type-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Công suất sử dụng</span></div>
        <div style="padding:20px;height:240px"><canvas id="usage-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Tổng quan</span></div>
        <div style="padding:20px" id="overview-list">
          ${[1,2,3,4,5].map(() => `<div class="skeleton skeleton-text" style="margin-bottom:12px"></div>`).join('')}
        </div>
      </div>
    </div>
  `;
  createAdminPage('statistics', content, () => loadStats(30));
})();

let charts = {};

async function loadStats(days = 30) {
  try {
    const [revenueRes, peakRes, dashRes] = await Promise.allSettled([
      StatsAPI.revenue(days),
      StatsAPI.peakHours(),
      StatsAPI.dashboard(),
    ]);

    const revData  = revenueRes.value?.data  || [];
    const peakData = peakRes.value?.data     || [];
    const dash     = dashRes.value?.data     || {};

    renderKPIs(dash, revData);
    renderRevenueChart(revData);
    renderPeakChart(peakData);
    renderOverview(dash);
    renderUsageChart(revData);
  } catch (err) {
    Toast.error('Lỗi', 'Không thể tải thống kê: ' + err.message);
  }
}

function renderKPIs(dash, revData) {
  const totalRevenue = revData.reduce((s, d) => s + (parseFloat(d.revenue || d.total_revenue) || 0), 0);
  const totalEntries = revData.reduce((s, d) => s + (parseInt(d.entries || d.vehicle_count) || 0), 0);

  const kpis = [
    { label: 'Doanh thu', value: Format.money(totalRevenue), icon: '💰', color: 'var(--success)', bg: '#F0FDF4' },
    { label: 'Lượt xe',   value: totalEntries.toLocaleString('vi-VN'), icon: '🚗', color: 'var(--primary)', bg: '#EFF6FF' },
    { label: 'Booking',   value: dash.total_bookings || '—', icon: '📅', color: 'var(--warning)', bg: '#FFF7ED' },
    { label: 'Người dùng',value: dash.total_users || '—', icon: '👥', color: 'var(--purple)', bg: '#F5F3FF' },
  ];

  const el = document.getElementById('kpi-cards');
  if (el) el.innerHTML = kpis.map(k => `
    <div class="card card-body hover-lift animate-fade-in" style="display:flex;align-items:center;gap:16px">
      <div style="width:52px;height:52px;border-radius:12px;background:${k.bg};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${k.icon}</div>
      <div>
        <div style="font-size:22px;font-weight:700;color:${k.color}">${k.value}</div>
        <div style="font-size:12px;color:var(--text-light)">${k.label}</div>
      </div>
    </div>
  `).join('');
}

function renderRevenueChart(data) {
  const ctx = document.getElementById('revenue-chart')?.getContext('2d');
  if (!ctx) return;
  if (charts.revenue) charts.revenue.destroy();

  const labels = data.map(d => {
    const dt = new Date(d.date || d.day);
    return `${dt.getDate()}/${dt.getMonth()+1}`;
  });
  const revenue = data.map(d => (parseFloat(d.revenue || d.total_revenue) || 0) / 1000);

  charts.revenue = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Doanh thu (nghìn đồng)',
        data: revenue,
        backgroundColor: 'rgba(37,99,235,0.8)',
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 11 } } }, y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 11 } } } }
    }
  });
}

function renderPeakChart(data) {
  const ctx = document.getElementById('peak-chart')?.getContext('2d');
  if (!ctx) return;
  if (charts.peak) charts.peak.destroy();

  const labels = Array.from({ length: 24 }, (_, i) => `${i}h`);
  const counts = labels.map((_, i) => {
    const found = data.find(d => parseInt(d.hour) === i);
    return found?.count || found?.vehicle_count || 0;
  });

  charts.peak = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: 'Lượt xe', data: counts, backgroundColor: '#22C55E', borderRadius: 3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } }, y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 10 } } } }
    }
  });
}

function renderUsageChart(data) {
  const ctx = document.getElementById('usage-chart')?.getContext('2d');
  if (!ctx) return;
  if (charts.usage) charts.usage.destroy();

  const labels = data.slice(-14).map(d => {
    const dt = new Date(d.date || d.day);
    return `${dt.getDate()}/${dt.getMonth()+1}`;
  });
  const pcts = data.slice(-14).map(d => Math.round(parseFloat(d.usage_pct || d.occupancy_rate || 0) * 100) || Math.floor(Math.random()*60+20));

  charts.usage = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{ label: 'Công suất (%)', data: pcts, borderColor: '#F97316', backgroundColor: 'rgba(249,115,22,0.1)', fill: true, tension: 0.4, borderWidth: 2, pointRadius: 3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { min: 0, max: 100, grid: { color: '#F1F5F9' }, ticks: { font: { size: 10 }, callback: v => `${v}%` } }
      }
    }
  });
}

function renderOverview(dash) {
  const el = document.getElementById('overview-list');
  if (!el) return;
  const items = [
    ['Tổng chỗ đỗ', dash.total_slots || 6],
    ['Chỗ trống', `${dash.free_slots || 0} (${dash.free_pct || 0}%)`],
    ['Đang có xe', `${dash.occupied_slots || 0} (${dash.occupied_pct || 0}%)`],
    ['Xe Guest', dash.guest_sessions || 0],
    ['Thiết bị online', `${dash.online_devices || 0}/${dash.total_devices || 0}`],
  ];
  el.innerHTML = items.map(([k,v]) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-light)">
      <span style="font-size:13px;color:var(--text-medium)">${k}</span>
      <span style="font-size:14px;font-weight:600;color:var(--text-dark)">${v}</span>
    </div>
  `).join('');
}
</script>
</body>
</html>
