<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiết bị IoT — Smart Parking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .device-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      padding: 22px;
      box-shadow: var(--shadow-card);
      transition: all var(--transition);
      position: relative;
    }
    .device-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
      border-color: #CBD5E1;
    }
    .device-card.offline { opacity: 0.82; }

    .device-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .device-icon-box {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-xs);
    }
    .device-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .device-id {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    .device-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .device-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }
    .device-row-label { color: var(--text-muted); font-weight: 500; }
    .device-row-val   { color: var(--text-dark); font-weight: 600; }
  </style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-layout.js"></script>
<script>
(function init() {
  if (!requireAdmin()) return;

  const content = `
    <div class="page-header flex justify-between items-center" style="flex-wrap:wrap;gap:16px">
      <div>
        <div class="page-title">Thiết bị IoT & Phần cứng</div>
        <div class="page-subtitle">Giám sát trạng thái vi điều khiển ESP32, cảm biến hồng ngoại, RFID và rơ le chấp hành</div>
      </div>
      <div style="display:flex;gap:10px">
        <a href="control.html" class="btn btn-primary">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg>
          Điều khiển trực tiếp
        </a>
        <button class="btn btn-outline" onclick="loadDevices()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Làm mới
        </button>
      </div>
    </div>

    <!-- 4 Metric KPI Cards -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px" class="stagger-children">
      <div class="stat-card">
        <div class="stat-icon icon-blue">🖥️</div>
        <div>
          <div class="stat-value" id="dev-total">—</div>
          <div class="stat-label">Tổng số thiết bị</div>
          <div class="stat-sub">Trong toàn bộ mạng IoT</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-green">🟢</div>
        <div>
          <div class="stat-value" style="color:var(--success)" id="dev-online">—</div>
          <div class="stat-label">Đang kết nối (Online)</div>
          <div class="stat-sub">Sẵn sàng nhận tín hiệu</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-red">🔴</div>
        <div>
          <div class="stat-value" style="color:var(--error)" id="dev-offline">—</div>
          <div class="stat-label">Mất kết nối (Offline)</div>
          <div class="stat-sub">Cần kiểm tra nguồn/WiFi</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-purple">📡</div>
        <div>
          <div class="stat-value" style="color:var(--purple)" id="dev-sensors">—</div>
          <div class="stat-label">Cảm biến IR & RFID</div>
          <div class="stat-sub">Đầu đọc và mắt thần</div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="card" style="padding:14px 20px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="search-input-wrap" style="flex:1;min-width:240px">
        <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="search-input" placeholder="Tìm tên thiết bị, mã thiết bị, vị trí..." id="dev-search" autocomplete="chrome-off" readonly onfocus="this.removeAttribute('readonly')" onblur="this.setAttribute('readonly','readonly')" oninput="renderDeviceGrid()">
      </div>
      <select class="filter-select" id="dev-status-filter" onchange="renderDeviceGrid()">
        <option value="">Tất cả trạng thái</option>
        <option value="ONLINE">Đang kết nối (Online)</option>
        <option value="OFFLINE">Mất kết nối (Offline)</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="resetDeviceFilters()">Xóa bộ lọc</button>
    </div>

    <!-- Device Cards Grid -->
    <div class="device-grid stagger-children" id="device-grid">
      ${[1, 2, 3, 4].map(() => `<div class="device-card"><div class="skeleton" style="height:140px"></div></div>`).join('')}
    </div>

    <!-- Device Logs Table -->
    <div class="card" style="margin-top:24px">
      <div class="card-header">
        <span class="card-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Nhật ký hoạt động thiết bị phần cứng
        </span>
      </div>
      <div class="table-wrapper" style="box-shadow:none;border:none">
        <table class="table">
          <thead>
            <tr>
              <th>Thời gian</th>
              <th>Thiết bị</th>
              <th>Sự kiện</th>
              <th>Dữ liệu Payload</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="dev-logs">${skeletonRows(5)}</tbody>
        </table>
      </div>
    </div>
  `;

  createAdminPage('parking-devices', content, () => {
    loadDevices();
    setInterval(loadDevices, 15000);
  });
})();

const DEVICE_DEFS = [
  { key: 'ESP32_1',      name: 'ESP32 #1',        icon: '🖥️', role: 'IR Slot Sensors (A01–A06)' },
  { key: 'ESP32_2',      name: 'ESP32 #2',        icon: '🖥️', role: 'Gate Control (RFID + Barrier + Light)' },
  { key: 'CAM_IN',       name: 'Camera IN',       icon: '📷', role: 'ANPR Camera — Lối vào' },
  { key: 'CAM_OUT',      name: 'Camera OUT',      icon: '📷', role: 'ANPR Camera — Lối ra' },
  { key: 'RFID_IN',      name: 'RFID Reader IN',  icon: '📡', role: 'RC522 RFID tại Cổng Vào' },
  { key: 'RFID_OUT',     name: 'RFID Reader OUT', icon: '📡', role: 'RC522 RFID tại Cổng Ra' },
  { key: 'IR_IN',        name: 'IR Sensor IN',    icon: '🔦', role: 'Cảm biến hồng ngoại Cổng Vào' },
  { key: 'IR_OUT',       name: 'IR Sensor OUT',   icon: '🔦', role: 'Cảm biến hồng ngoại Cổng Ra' },
  { key: 'SERVO_IN',     name: 'Servo Barrier IN',icon: '⚙️', role: 'Motor barrier Cổng Vào' },
  { key: 'SERVO_OUT',    name: 'Servo Barrier OUT',icon: '⚙️', role: 'Motor barrier Cổng Ra' },
  { key: 'RELAY_LIGHT',  name: 'Relay Đèn',       icon: '💡', role: 'Relay điều khiển đèn bãi xe' },
];

let rawDevicesList = [];

function resetDeviceFilters() {
  const s = document.getElementById('dev-search');
  const st = document.getElementById('dev-status-filter');
  if (s) s.value = '';
  if (st) st.value = '';
  renderDeviceGrid();
}

async function loadDevices() {
  try {
    const res = await DeviceAPI.getAll();
    rawDevicesList = res?.data || [];

    const online = rawDevicesList.filter(d => d.status === 'ONLINE').length;
    const devTotal = document.getElementById('dev-total');
    const devOnline = document.getElementById('dev-online');
    const devOffline = document.getElementById('dev-offline');
    const devSensors = document.getElementById('dev-sensors');

    if (devTotal) devTotal.textContent = DEVICE_DEFS.length;
    if (devOnline) devOnline.textContent = online;
    if (devOffline) devOffline.textContent = Math.max(0, DEVICE_DEFS.length - online);
    if (devSensors) devSensors.textContent = DEVICE_DEFS.filter(d => d.key.startsWith('IR') || d.key.startsWith('RFID')).length;

    renderDeviceGrid();

    // Load device logs
    const logsRes = await DeviceAPI.getAllLogs();
    const logs = logsRes?.data?.slice(0, 15) || [];
    const tbody = document.getElementById('dev-logs');
    if (tbody) {
      tbody.innerHTML = logs.length ? logs.map(l => `
        <tr>
          <td style="font-size:12.5px;color:var(--text-medium)">${Format.datetime(l.created_at)}</td>
          <td><strong style="color:var(--text-dark)">${l.device_name || l.device_code || '—'}</strong></td>
          <td><span class="badge badge-primary">${l.event_type || l.action || '—'}</span></td>
          <td style="max-width:240px">
            <code style="font-family:'JetBrains Mono',monospace;font-size:11.5px;background:#F1F5F9;padding:2px 8px;border-radius:4px;color:var(--text-dark)">
              ${JSON.stringify(l.data || {}).slice(0, 75)}
            </code>
          </td>
          <td>
            ${l.status === 'SUCCESS' ? '<span class="badge badge-success">Thành công</span>' : '<span class="badge badge-error">Lỗi</span>'}
          </td>
        </tr>
      `).join('') : `<tr><td colspan="5" class="empty-state">Chưa có nhật ký thiết bị</td></tr>`;
    }
  } catch (err) {
    Toast.error('Lỗi', 'Không thể tải dữ liệu thiết bị: ' + err.message);
  }
}

function renderDeviceGrid() {
  const search = document.getElementById('dev-search')?.value.trim().toLowerCase() || '';
  const statusFilter = document.getElementById('dev-status-filter')?.value || '';

  const grid = document.getElementById('device-grid');
  if (!grid) return;

  let defs = DEVICE_DEFS;
  if (search) {
    defs = defs.filter(d => d.name.toLowerCase().includes(search) || d.key.toLowerCase().includes(search) || d.role.toLowerCase().includes(search));
  }

  const renderedItems = defs.map(def => {
    const dev = rawDevicesList.find(d => d.device_code === def.key || d.device_name?.includes(def.name.replace(' #', ' ').split(' ')[1] || ''));
    const online = dev?.status === 'ONLINE';
    return { def, dev, online };
  }).filter(item => {
    if (!statusFilter) return true;
    if (statusFilter === 'ONLINE') return item.online;
    if (statusFilter === 'OFFLINE') return !item.online;
    return true;
  });

  if (!renderedItems.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--text-light);font-weight:500">Không tìm thấy thiết bị phù hợp</div>`;
    return;
  }

  grid.innerHTML = renderedItems.map(({ def, dev, online }) => `
    <div class="device-card ${online ? '' : 'offline'} animate-fade-in">
      <div class="device-header">
        <div class="device-icon-box">${def.icon}</div>
        <span class="badge ${online ? 'badge-success' : 'badge-error'}">
          ${online ? '● Online' : '○ Offline'}
        </span>
      </div>
      <div class="device-name">${def.name}</div>
      <div class="device-id">${dev?.device_code || def.key}</div>
      <div style="height:1px;background:var(--border-light);margin:14px 0"></div>
      <div class="device-info">
        <div class="device-row">
          <span class="device-row-label">Chức năng</span>
          <span class="device-row-val" style="text-align:right;max-width:160px;font-size:11.5px">${def.role}</span>
        </div>
        <div class="device-row">
          <span class="device-row-label">Trạng thái</span>
          <span class="device-row-val" style="color:${online ? 'var(--success)' : 'var(--text-light)'}">
            ${dev?.current_state || (online ? 'Đang hoạt động' : 'Chờ kết nối')}
          </span>
        </div>
        <div class="device-row">
          <span class="device-row-label">Cập nhật</span>
          <span class="device-row-val" style="font-size:11.5px;color:var(--text-muted)">
            ${dev?.last_seen ? Format.timeAgo(dev.last_seen) : '—'}
          </span>
        </div>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
