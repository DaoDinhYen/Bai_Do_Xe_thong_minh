<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera ANPR — Smart Parking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .cam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media(max-width:900px) { .cam-grid { grid-template-columns: 1fr; } }
    .cam-card {
      background: white; border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .cam-header {
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
    }
    .cam-title { font-weight: 600; font-size: 15px; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
    .cam-feed {
      position: relative; background: #0F172A; height: 260px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .cam-feed img { width: 100%; height: 100%; object-fit: cover; }
    .cam-placeholder { text-align: center; color: #94A3B8; }
    .anpr-result {
      padding: 16px 20px; background: white;
      border-top: 1px solid var(--border-light);
    }
    .anpr-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .anpr-row:last-child { margin-bottom: 0; }
    .anpr-label { color: var(--text-light); }
    .anpr-val   { font-weight: 600; color: var(--text-dark); }
    .plate-display {
      font-family: monospace; font-size: 16px; font-weight: 700;
      letter-spacing: 2px; color: var(--primary);
      background: var(--bg); padding: 4px 10px; border-radius: 6px;
    }
    .confidence-bar {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px;
    }
    .confidence-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  </style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-layout.js"></script>
<script>
(function init() {
  if (!requireAdmin()) return;

  const content = `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="page-title">Camera & Nhận diện biển số (ANPR)</div>
        <div class="page-subtitle">Giám sát hình ảnh trực tiếp và đối soát biển số tại 2 cổng</div>
      </div>
      <button class="btn btn-outline" onclick="loadLatest(); loadRecords(1)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Làm mới
      </button>
    </div>

    <!-- Live Feeds -->
    <div class="cam-grid stagger-children">
      <!-- Camera IN -->
      <div class="cam-card">
        <div class="cam-header">
          <div class="cam-title">📷 Camera IN — Cổng vào</div>
          <span class="badge" id="cam-in-status" style="background:#F0FDF4;color:#22C55E">● Sẵn sàng</span>
        </div>
        <div class="cam-feed" id="cam-in-feed">
          <div class="cam-placeholder" id="cam-in-placeholder">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 10px"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <div style="font-size:13px;font-weight:500">Camera IN — Giám sát luồng vào</div>
            <div style="font-size:11px;opacity:0.6;margin-top:4px">Tự động nhận diện biển số khi xe dừng trước barrier</div>
          </div>
        </div>
        <div class="anpr-result" id="anpr-in-result">
          <div class="anpr-row"><span class="anpr-label">Biển số nhận diện</span><div class="plate-display" id="plate-in">—  —  —</div></div>
          <div class="anpr-row">
            <div>
              <span class="anpr-label">Độ chính xác AI</span>
              <div class="confidence-bar" style="width:120px"><div class="confidence-fill" id="conf-in-bar" style="width:0%;background:#22C55E"></div></div>
            </div>
            <span class="anpr-val" id="conf-in">—</span>
          </div>
          <div class="anpr-row"><span class="anpr-label">Thời gian chụp</span><span class="anpr-val" id="time-in">—</span></div>
          <div class="anpr-row"><span class="anpr-label">Thẻ RFID quẹt</span><span id="rfid-in" style="font-size:13px">—</span></div>
          <div class="anpr-row"><span class="anpr-label">Đối soát hệ thống</span><span id="result-in">—</span></div>
        </div>
      </div>

      <!-- Camera OUT -->
      <div class="cam-card">
        <div class="cam-header">
          <div class="cam-title">📷 Camera OUT — Cổng ra</div>
          <span class="badge" id="cam-out-status" style="background:#F0FDF4;color:#22C55E">● Sẵn sàng</span>
        </div>
        <div class="cam-feed" id="cam-out-feed">
          <div class="cam-placeholder" id="cam-out-placeholder">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin:0 auto 10px"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <div style="font-size:13px;font-weight:500">Camera OUT — Giám sát luồng ra</div>
            <div style="font-size:11px;opacity:0.6;margin-top:4px">Đối chiếu biển số lúc vào trước khi mở barrier ra</div>
          </div>
        </div>
        <div class="anpr-result" id="anpr-out-result">
          <div class="anpr-row"><span class="anpr-label">Biển số nhận diện</span><div class="plate-display" id="plate-out">—  —  —</div></div>
          <div class="anpr-row">
            <div>
              <span class="anpr-label">Độ chính xác AI</span>
              <div class="confidence-bar" style="width:120px"><div class="confidence-fill" id="conf-out-bar" style="width:0%;background:#22C55E"></div></div>
            </div>
            <span class="anpr-val" id="conf-out">—</span>
          </div>
          <div class="anpr-row"><span class="anpr-label">Thời gian chụp</span><span class="anpr-val" id="time-out">—</span></div>
          <div class="anpr-row"><span class="anpr-label">Thẻ RFID quẹt</span><span id="rfid-out" style="font-size:13px">—</span></div>
          <div class="anpr-row"><span class="anpr-label">Đối soát hệ thống</span><span id="result-out">—</span></div>
        </div>
      </div>
    </div>

    <!-- Detection History -->
    <div class="card">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <span class="card-title">Nhật ký nhận diện biển số</span>
        <div class="search-bar" style="display:flex;gap:8px;padding:0;align-items:center;flex-wrap:wrap">
          <div class="search-input-wrap" style="width:200px">
            <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="search-input" placeholder="Tìm biển số, RFID..." id="cam-search" autocomplete="chrome-off" readonly onfocus="this.removeAttribute('readonly')" onblur="this.setAttribute('readonly','readonly')" oninput="debouncedSearchCam()">
          </div>
          <select class="filter-select" id="cam-filter" onchange="loadRecords(1)" style="height:36px;font-size:12px">
            <option value="">Tất cả camera</option>
            <option value="1">Cổng vào (Camera IN)</option>
            <option value="2">Cổng ra (Camera OUT)</option>
          </select>
          <select class="filter-select" id="cam-status" onchange="loadRecords(1)" style="height:36px;font-size:12px">
            <option value="">Tất cả kết quả</option>
            <option value="VERIFIED">Đã xác thực (Khớp)</option>
            <option value="FAILED">Từ chối (Sai lệch)</option>
            <option value="PENDING">Chờ xử lý</option>
          </select>
          <input type="date" class="filter-select" id="cam-date" onchange="loadRecords(1)" style="height:36px;font-size:12px" title="Lọc theo ngày">
          <button class="btn btn-outline btn-sm" onclick="resetCameraFilters()">Xóa lọc</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="table">
          <thead><tr>
            <th>Thời gian</th><th>Cổng</th><th>Biển số nhận diện</th><th>Độ chính xác</th>
            <th>RFID</th><th>Chủ sở hữu</th><th>Kết quả xác thực</th><th>Thao tác</th>
          </tr></thead>
          <tbody id="cam-records">${skeletonRows(6)}</tbody>
        </table>
      </div>
      <div id="cam-pager"></div>
    </div>

    <!-- Camera Record Modal -->
    <div id="cam-modal" class="modal-overlay">
      <div class="modal" style="max-width:520px">
        <div class="modal-header">
          <span class="modal-title">Chi tiết lượt nhận diện</span>
          <button class="modal-close" onclick="closeCamModal()">✕</button>
        </div>
        <div class="modal-body" id="cam-modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeCamModal()">Đóng</button>
        </div>
      </div>
    </div>
  `;
  createAdminPage('camera', content, () => {
    loadLatest();
    loadRecords(1);
    window.debouncedSearchCam = debounce(() => loadRecords(1), 400);
    setInterval(loadLatest, 10000);
  });
})();

let currentRecordList = [];

function resetCameraFilters() {
  const s = document.getElementById('cam-search');
  const f = document.getElementById('cam-filter');
  const st = document.getElementById('cam-status');
  const d = document.getElementById('cam-date');
  if (s) s.value = '';
  if (f) f.value = '';
  if (st) st.value = '';
  if (d) d.value = '';
  loadRecords(1);
}

async function loadLatest() {
  try {
    const res = await CameraAPI.getLatest();
    const data = res?.data || {};

    let camIn = null;
    let camOut = null;

    if (Array.isArray(data)) {
      camIn = data.find(r => r.camera_id === 1 || r.direction === 'IN' || r.camera_type === 'IN');
      camOut = data.find(r => r.camera_id === 2 || r.direction === 'OUT' || r.camera_type === 'OUT');
    } else {
      camIn = data.in;
      camOut = data.out;
    }

    if (camIn)  updateCameraPanel('in',  camIn);
    if (camOut) updateCameraPanel('out', camOut);
  } catch {}
}

function updateCameraPanel(type, record) {
  const plate    = document.getElementById(`plate-${type}`);
  const confEl   = document.getElementById(`conf-${type}`);
  const confBar  = document.getElementById(`conf-${type}-bar`);
  const timeEl   = document.getElementById(`time-${type}`);
  const rfidEl   = document.getElementById(`rfid-${type}`);
  const resultEl = document.getElementById(`result-${type}`);
  const feedEl   = document.getElementById(`cam-${type}-feed`);

  if (plate)    plate.textContent = record.detected_plate || record.plate_number || '—';
  const confVal = parseFloat(record.confidence || 0);
  const conf = Math.round(confVal > 1 ? confVal : confVal * 100);
  if (confEl)   confEl.textContent = `${conf}%`;
  if (confBar)  { confBar.style.width = `${conf}%`; confBar.style.background = conf >= 80 ? '#22C55E' : conf >= 60 ? '#F97316' : '#EF4444'; }
  if (timeEl)   timeEl.textContent = Format.datetime(record.captured_at || record.created_at);
  if (rfidEl)   rfidEl.innerHTML = record.rfid_uid ? `<code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px;font-weight:600">${record.rfid_uid}</code>` : '<span style="color:var(--text-light)">—</span>';
  if (resultEl) {
    const ok = record.verification_status === 'VERIFIED' || record.verification_result === 'VERIFIED' || record.is_verified;
    const failed = record.verification_status === 'FAILED' || record.verification_result === 'FAILED';
    resultEl.innerHTML = ok ? '<span class="badge badge-success">✓ Hợp lệ — Mở barrier</span>' : (failed ? '<span class="badge badge-error">✗ Sai lệch biển số</span>' : '<span class="badge badge-gray">Đang đối soát</span>');
  }

  if (feedEl && record.image_path) {
    feedEl.innerHTML = `<img src="${record.image_path}" alt="Captured Plate" style="width:100%;height:100%;object-fit:cover">`;
  }
}

async function loadRecords(page = 1) {
  const camId = document.getElementById('cam-filter')?.value || '';
  const search = (document.getElementById('cam-search')?.value || '').trim();
  const status = document.getElementById('cam-status')?.value || '';
  const date = document.getElementById('cam-date')?.value || '';
  const tbody = document.getElementById('cam-records');
  if (tbody) tbody.innerHTML = skeletonRows(6);

  try {
    const params = { page, limit: 15 };
    if (camId) params.camera_id = camId;
    if (search) params.search = search;
    if (status) params.status = status;
    if (date) params.date = date;

    const res = await CameraAPI.getRecords(params);
    let data = Array.isArray(res?.data) ? res.data : (res?.data?.data || []);
    
    // Strict client-side date safety filter
    if (date) {
      const toYMD = (val) => {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };
      data = data.filter(r => toYMD(r.captured_at || r.created_at) === date);
    }
    const total = res?.pagination?.total ?? res?.total ?? data.length;
    currentRecordList = data;

    if (!tbody) return;
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">📷</div><div class="empty-state-title">Không tìm thấy dữ liệu nhận diện nào</div></div></td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(r => {
      const confVal = parseFloat(r.confidence || 0);
      const conf = Math.round(confVal > 1 ? confVal : confVal * 100);
      const isVerified = r.verification_status === 'VERIFIED' || r.verification_result === 'VERIFIED' || r.is_verified;
      const isFailed = r.verification_status === 'FAILED' || r.verification_result === 'FAILED';
      const isIN = r.camera_id === 1 || r.direction === 'IN' || r.camera_type === 'IN';

      return `
        <tr>
          <td style="font-size:12px">${Format.datetime(r.captured_at || r.created_at)}</td>
          <td>${isIN ? '<span class="badge badge-primary">Cổng vào</span>' : '<span class="badge badge-teal">Cổng ra</span>'}</td>
          <td><code style="background:var(--bg);padding:3px 8px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:1px">${r.detected_plate || r.plate_number || '—'}</code></td>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="height:5px;width:55px;background:var(--border);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${conf}%;background:${conf>=80?'#22C55E':conf>=60?'#F97316':'#EF4444'}"></div>
              </div>
              <span style="font-size:12px;font-weight:600">${conf}%</span>
            </div>
          </td>
          <td>${r.rfid_uid ? `<code style="font-size:11px;background:var(--bg);padding:2px 6px;border-radius:4px">${r.rfid_uid}</code>` : '—'}</td>
          <td style="font-size:12px">${r.user_name || (r.vehicle_id ? 'Xe đã đăng ký' : '<span style="color:var(--text-light)">Khách vãng lai</span>')}</td>
          <td>${isVerified ? '<span class="badge badge-success">✓ Khớp</span>' : (isFailed ? '<span class="badge badge-error">✗ Không khớp</span>' : '<span class="badge badge-gray">Chờ</span>')}</td>
          <td>
            <button class="btn btn-sm btn-ghost" onclick="viewCamRecord(${r.id})">Chi tiết</button>
          </td>
        </tr>
      `;
    }).join('');

    new Pagination({ container: 'cam-pager', total, page, limit: 15, onChange: loadRecords }).render();
  } catch (err) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--error);padding:24px">Lỗi: ${err.message}</td></tr>`;
  }
}

function viewCamRecord(id) {
  const r = currentRecordList.find(x => x.id === id);
  if (!r) return;

  const modal = document.getElementById('cam-modal');
  const body = document.getElementById('cam-modal-body');
  if (!modal || !body) return;

  const confVal = parseFloat(r.confidence || 0);
  const conf = Math.round(confVal > 1 ? confVal : confVal * 100);
  const isIN = r.camera_id === 1 || r.direction === 'IN' || r.camera_type === 'IN';
  const isVerified = r.verification_status === 'VERIFIED' || r.verification_result === 'VERIFIED' || r.is_verified;

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border-light)">
      <div style="font-size:32px">📷</div>
      <div>
        <div style="font-size:18px;font-weight:700;letter-spacing:1px;font-family:monospace">${r.detected_plate || r.plate_number || '—'}</div>
        <div style="font-size:12px;color:var(--text-light);margin-top:2px">Thời gian: ${Format.datetime(r.captured_at || r.created_at)}</div>
      </div>
      <div style="margin-left:auto">
        <span class="badge ${isIN ? 'badge-primary' : 'badge-teal'}">${isIN ? 'Camera Cổng Vào' : 'Camera Cổng Ra'}</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${[
        ['Biển số nhận dạng', `<code>${r.detected_plate || r.plate_number || '—'}</code>`],
        ['Biển số đăng ký', r.registered_plate ? `<code>${r.registered_plate}</code>` : 'Khách vãng lai'],
        ['Độ tin cậy AI', `<span style="font-weight:700;color:${conf>=80?'var(--success)':'var(--warning)'}">${conf}%</span>`],
        ['Thẻ RFID đi kèm', r.rfid_uid ? `<code>${r.rfid_uid}</code>` : 'Không có thẻ'],
        ['Chủ sở hữu xe', r.user_name || 'Khách vãng lai'],
        ['Trạng thái xác thực', isVerified ? '<span class="badge badge-success">✓ Xác thực thành công</span>' : '<span class="badge badge-error">Chưa đạt yêu cầu</span>']
      ].map(([k,v]) => `
        <div><div style="font-size:11px;color:var(--text-light);margin-bottom:4px">${k}</div><div style="font-size:13px;font-weight:500">${v}</div></div>
      `).join('')}
    </div>
  `;
  modal.classList.add('open');
}

function closeCamModal() {
  document.getElementById('cam-modal')?.classList.remove('open');
}
</script>
</body>
</html>
