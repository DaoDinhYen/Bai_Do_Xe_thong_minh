<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều khiển — Smart Parking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
    @media(max-width:900px) { .control-grid { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:600px) { .control-grid { grid-template-columns: 1fr; } }

    .ctrl-card {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 28px 24px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .ctrl-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
    }
    .ctrl-title    { font-size: 17px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
    .ctrl-status   { font-size: 13px; margin-bottom: 24px; font-weight: 500; }
    .ctrl-btns     { display: flex; gap: 10px; }
    .ctrl-btn-full { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ctrl-btn-full:hover:not(:disabled) { filter: brightness(0.92); transform: translateY(-1px); }
    .ctrl-btn-full:disabled { opacity: 0.5; cursor: not-allowed; }

    .log-panel { background: #0F172A; border-radius: 12px; padding: 16px; font-family: monospace; max-height: 300px; overflow-y: auto; }
    .log-line  { font-size: 12px; margin-bottom: 4px; }
    .log-line.success { color: #4ADE80; }
    .log-line.error   { color: #F87171; }
    .log-line.info    { color: #93C5FD; }
    .log-line.warn    { color: #FCD34D; }
  </style>
</head>
<body>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-layout.js"></script>
<script>
(function init() {
  if (!requireAdmin()) return;

  const content = `
    <div class="page-header">
      <div class="page-title">Điều khiển</div>
      <div class="page-subtitle">Điều khiển barrier và đèn bãi xe từ xa</div>
    </div>

    <div class="control-grid stagger-children">
      <!-- Barrier IN -->
      <div class="ctrl-card">
        <div class="ctrl-icon" style="background:#EFF6FF">🚧</div>
        <div class="ctrl-title">Barrier IN</div>
        <div class="ctrl-status" id="barrier-in-status"><span class="badge badge-gray">Chưa xác định</span></div>
        <div class="ctrl-btns">
          <button class="ctrl-btn-full" style="background:#22C55E;color:white" onclick="ctrlBarrier('barrier_in','OPEN')" id="btn-in-open">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            Mở
          </button>
          <button class="ctrl-btn-full" style="background:#EF4444;color:white" onclick="ctrlBarrier('barrier_in','CLOSE')" id="btn-in-close">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            Đóng
          </button>
        </div>
      </div>

      <!-- Barrier OUT -->
      <div class="ctrl-card">
        <div class="ctrl-icon" style="background:#FEF3C7">🚧</div>
        <div class="ctrl-title">Barrier OUT</div>
        <div class="ctrl-status" id="barrier-out-status"><span class="badge badge-gray">Chưa xác định</span></div>
        <div class="ctrl-btns">
          <button class="ctrl-btn-full" style="background:#22C55E;color:white" onclick="ctrlBarrier('barrier_out','OPEN')" id="btn-out-open">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            Mở
          </button>
          <button class="ctrl-btn-full" style="background:#EF4444;color:white" onclick="ctrlBarrier('barrier_out','CLOSE')" id="btn-out-close">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            Đóng
          </button>
        </div>
      </div>

      <!-- Đèn bãi xe -->
      <div class="ctrl-card">
        <div class="ctrl-icon" style="background:#FFFBEB">💡</div>
        <div class="ctrl-title">Đèn bãi xe</div>
        <div class="ctrl-status" id="light-status"><span class="badge badge-gray">Chưa xác định</span></div>
        <div class="ctrl-btns">
          <button class="ctrl-btn-full" style="background:#F97316;color:white" onclick="ctrlLight('ON')">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            Bật
          </button>
          <button class="ctrl-btn-full" style="background:#64748B;color:white" onclick="ctrlLight('OFF')">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="6"/><path d="M17.66 4.34A6 6 0 1 1 6.34 17.66"/></svg>
            Tắt
          </button>
        </div>
      </div>
    </div>

    <!-- Emergency Controls -->
    <div class="card mb-6">
      <div class="card-header">
        <span class="card-title">Khẩn cấp</span>
        <span class="badge badge-error">⚠️ Cẩn thận</span>
      </div>
      <div style="padding:20px;display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-error" onclick="openAllBarriers()">
          🔓 Mở tất cả barrier khẩn cấp
        </button>
        <button class="btn btn-ghost" onclick="closeAllBarriers()">
          🔒 Đóng tất cả barrier
        </button>
      </div>
    </div>

    <!-- Control Log -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Nhật ký điều khiển</span>
        <button class="btn btn-sm btn-ghost" onclick="clearLog()">Xóa</button>
      </div>
      <div class="log-panel" id="ctrl-log">
        <div class="log-line info">[${new Date().toLocaleTimeString('vi-VN')}] Hệ thống sẵn sàng...</div>
      </div>
    </div>
  `;

  createAdminPage('parking-control', content, () => {
    loadBarrierStatus();
  });
})();

function addLog(msg, type = 'info') {
  const log = document.getElementById('ctrl-log');
  if (!log) return;
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString('vi-VN')}] ${msg}`;
  log.insertBefore(line, log.firstChild);
  if (log.children.length > 50) log.lastChild?.remove();
}

async function loadBarrierStatus() {
  try {
    const res = await DeviceAPI.getAll();
    const devices = res?.data || [];
    // Extract status from device logs if available
    addLog('Đã kết nối với hệ thống', 'success');
  } catch {
    addLog('Không thể kết nối với hệ thống', 'error');
  }
}

async function ctrlBarrier(target, action) {
  const label = target === 'barrier_in' ? 'Barrier IN' : 'Barrier OUT';
  const actionLabel = action === 'OPEN' ? 'Mở' : 'Đóng';
  const ok = await showConfirm({ title: `${actionLabel} ${label}`, message: `Xác nhận ${actionLabel.toLowerCase()} ${label}?`, confirmText: actionLabel });
  if (!ok) return;

  addLog(`Đang ${actionLabel.toLowerCase()} ${label}...`, 'warn');
  try {
    await DeviceAPI.controlBarrier({ target, action });
    const statusEl = document.getElementById(target === 'barrier_in' ? 'barrier-in-status' : 'barrier-out-status');
    if (statusEl) {
      const open = action === 'OPEN';
      statusEl.innerHTML = `<span class="badge ${open ? 'badge-success' : 'badge-error'}">${open ? '🔓 Đang mở' : '🔒 Đã đóng'}</span>`;
    }
    addLog(`✓ ${label} đã ${actionLabel.toLowerCase()} thành công`, 'success');
    Toast.success('Thành công', `${label} đã ${actionLabel.toLowerCase()}`);
  } catch (e) {
    addLog(`✗ Lỗi: ${e.message}`, 'error');
    Toast.error('Lỗi', e.message || 'Không thể điều khiển barrier');
  }
}

async function ctrlLight(action) {
  const ok = await showConfirm({ title: `${action === 'ON' ? 'Bật' : 'Tắt'} đèn`, message: `Xác nhận ${action === 'ON' ? 'bật' : 'tắt'} đèn bãi xe?`, confirmText: action === 'ON' ? 'Bật đèn' : 'Tắt đèn' });
  if (!ok) return;
  try {
    await DeviceAPI.controlLight({ action });
    const statusEl = document.getElementById('light-status');
    if (statusEl) statusEl.innerHTML = `<span class="badge ${action === 'ON' ? 'badge-warning' : 'badge-gray'}">${action === 'ON' ? '💡 Đang bật' : '🌑 Đã tắt'}</span>`;
    addLog(`✓ Đèn đã ${action === 'ON' ? 'bật' : 'tắt'} thành công`, 'success');
    Toast.success('Thành công', `Đèn bãi xe đã ${action === 'ON' ? 'bật' : 'tắt'}`);
  } catch (e) {
    addLog(`✗ Lỗi đèn: ${e.message}`, 'error');
    Toast.error('Lỗi', e.message);
  }
}

async function openAllBarriers() {
  const ok = await showConfirm({ title: '⚠️ Mở khẩn cấp', message: 'Mở tất cả barrier? Hành động này có thể gây nguy hiểm.', confirmText: 'Mở tất cả', danger: true });
  if (!ok) return;
  await ctrlBarrier('barrier_in', 'OPEN').catch(() => {});
  await ctrlBarrier('barrier_out', 'OPEN').catch(() => {});
  addLog('⚠️ Mở tất cả barrier khẩn cấp', 'warn');
}

async function closeAllBarriers() {
  const ok = await showConfirm({ title: 'Đóng tất cả barrier', message: 'Đóng cả Barrier IN và Barrier OUT?', confirmText: 'Đóng tất cả' });
  if (!ok) return;
  await Promise.allSettled([DeviceAPI.controlBarrier({ target: 'barrier_in', action: 'CLOSE' }), DeviceAPI.controlBarrier({ target: 'barrier_out', action: 'CLOSE' })]);
  addLog('Đã đóng tất cả barrier', 'info');
  Toast.success('Thành công', 'Đã đóng tất cả barrier');
}

function clearLog() {
  const log = document.getElementById('ctrl-log');
  if (log) log.innerHTML = '';
}
</script>
</body>
</html>
