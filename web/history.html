<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử gửi xe — Smart Parking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-layout.js"></script>
<script>
(function init() {
  if (!requireAdmin()) return;

  const content = `
    <div class="page-header flex justify-between items-center" style="flex-wrap:wrap;gap:16px">
      <div>
        <div class="page-title">Lịch sử ra vào bãi xe</div>
        <div class="page-subtitle">Nhật ký chi tiết các lượt xe gửi, thời gian lưu bãi, đối soát ANPR và phí dịch vụ</div>
      </div>
      <button class="btn btn-outline" onclick="loadHistory(1)">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Làm mới dữ liệu
      </button>
    </div>

    <!-- Data Card -->
    <div class="card">
      <div class="search-bar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div class="search-input-wrap" style="flex:1;min-width:240px">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" class="search-input" placeholder="Tìm theo biển số, tên khách, mã thẻ RFID..." id="h-search" autocomplete="chrome-off" readonly onfocus="this.removeAttribute('readonly')" onblur="this.setAttribute('readonly','readonly')" oninput="debouncedSearchH()">
        </div>
        <select class="filter-select" id="h-type" onchange="loadHistory(1)">
          <option value="">Tất cả đối tượng</option>
          <option value="registered">Thành viên có tài khoản</option>
          <option value="guest">Khách vãng lai (Guest)</option>
        </select>
        <select class="filter-select" id="h-status" onchange="loadHistory(1)">
          <option value="">Tất cả trạng thái</option>
          <option value="ACTIVE">Đang đỗ trong bãi</option>
          <option value="COMPLETED">Đã hoàn thành lượt gửi</option>
        </select>
        <input type="date" class="filter-select" id="h-date" onchange="loadHistory(1)" title="Lọc theo ngày">
        <button class="btn btn-outline btn-sm" onclick="resetHistoryFilters()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          Xóa lọc
        </button>
      </div>

      <div class="table-wrapper" style="box-shadow:none;border:none">
        <table class="table">
          <thead>
            <tr>
              <th>Biển số xe</th>
              <th>Khách hàng</th>
              <th>Chỗ đỗ</th>
              <th>Thời gian vào</th>
              <th>Thời gian ra</th>
              <th>Thời lượng đỗ</th>
              <th>Phí gửi xe</th>
              <th>Phương thức xác thực</th>
              <th>Trạng thái</th>
              <th style="text-align:right">Thao tác</th>
            </tr>
          </thead>
          <tbody id="history-table">${skeletonRows(7)}</tbody>
        </table>
      </div>
      <div id="history-pager"></div>
    </div>

    <!-- History Detail Modal -->
    <div id="history-modal" class="modal-overlay">
      <div class="modal" style="max-width:680px">
        <div class="modal-header">
          <span class="modal-title">Chi tiết phiên gửi xe</span>
          <button class="modal-close" onclick="closeHistoryModal()">✕</button>
        </div>
        <div class="modal-body" id="history-modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-primary" onclick="closeHistoryModal()">Đóng</button>
        </div>
      </div>
    </div>
  `;

  createAdminPage('history', content, () => {
    loadHistory(1);
    window.debouncedSearchH = debounce(() => loadHistory(1), 400);
  });
})();

let currentHistoryCache = [];

function resetHistoryFilters() {
  const s = document.getElementById('h-search');
  const t = document.getElementById('h-type');
  const st = document.getElementById('h-status');
  const d = document.getElementById('h-date');
  if (s) s.value = '';
  if (t) t.value = '';
  if (st) st.value = '';
  if (d) d.value = '';
  loadHistory(1);
}

async function loadHistory(page = 1) {
  const search = document.getElementById('h-search')?.value.trim() || '';
  const type   = document.getElementById('h-type')?.value || '';
  const status = document.getElementById('h-status')?.value || '';
  const date   = document.getElementById('h-date')?.value || '';

  const tbody = document.getElementById('history-table');
  if (tbody) tbody.innerHTML = skeletonRows(7);

  try {
    const params = { page: 1, limit: 100 };
    if (search) params.search = search;
    if (status) params.status = status;
    if (date) params.date = date;

    let registeredData = [];
    let guestData = [];

    const fetches = [];
    if (!type || type === 'registered') {
      fetches.push(
        HistoryAPI.getAll(params).then(res => {
          registeredData = Array.isArray(res?.data) ? res.data : (res?.data?.data || []);
        }).catch(() => {})
      );
    }
    if (!type || type === 'guest') {
      fetches.push(
        HistoryAPI.getGuestSessions(params).then(res => {
          guestData = Array.isArray(res?.data) ? res.data : (res?.data?.data || []);
        }).catch(() => {})
      );
    }
    await Promise.allSettled(fetches);

    let combined = [];
    if (!type || type === 'registered') {
      combined.push(...registeredData.map(h => ({
        ...h,
        _type: 'registered',
        plate_number: h.plate_number,
        slot_code: h.slot_code || h.slot_name,
        entry_time: h.entry_time || h.start_time,
        exit_time: h.exit_time || h.end_time
      })));
    }
    if (!type || type === 'guest') {
      combined.push(...guestData.map(g => ({
        ...g,
        _type: 'guest',
        plate_number: g.license_plate || g.plate_number,
        slot_code: g.parking_slot || g.slot_code,
        slot_name: g.parking_slot || g.slot_code,
        entry_time: g.entry_time,
        exit_time: g.exit_time
      })));
    }

    const toYMD = (val) => {
      if (!val) return '';
      const d = new Date(val);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    let filtered = combined.filter(h => {
      const isParking = h.status === 'ACTIVE' || (!h.exit_time && !h.end_time);
      if (status === 'ACTIVE' && !isParking) return false;
      if (status === 'COMPLETED' && isParking) return false;

      if (date) {
        const inYMD = toYMD(h.entry_time);
        const outYMD = toYMD(h.exit_time);
        if (inYMD !== date && outYMD !== date) return false;
      }

      if (search) {
        const s = search.toLowerCase();
        const pMatch = (h.plate_number || '').toLowerCase().includes(s);
        const uMatch = (h.user_name || '').toLowerCase().includes(s);
        const sMatch = (h.slot_code || '').toLowerCase().includes(s);
        const rMatch = (h.rfid_uid || '').toLowerCase().includes(s);
        if (!pMatch && !uMatch && !sMatch && !rMatch) return false;
      }

      return true;
    });

    filtered.sort((a, b) => new Date(b.entry_time || 0) - new Date(a.entry_time || 0));
    currentHistoryCache = filtered;

    if (!tbody) return;
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon">🚗</div><div class="empty-state-title">Không tìm thấy lượt gửi xe nào phù hợp</div></div></td></tr>`;
      const pagerEl = document.getElementById('history-pager');
      if (pagerEl) pagerEl.innerHTML = '';
      return;
    }

    const limit = 15;
    const total = filtered.length;
    const totalPages = Math.ceil(total / limit);
    const currPage = Math.min(page, totalPages) || 1;
    const paged = filtered.slice((currPage - 1) * limit, currPage * limit);

    tbody.innerHTML = paged.map((h, idx) => {
      const globalIdx = (currPage - 1) * limit + idx;
      const isGuest = h._type === 'guest';
      const entryTime  = h.entry_time;
      const exitTime   = h.exit_time;
      const duration   = h.duration ?? h.actual_minutes ?? h.duration_minutes;
      const slotText   = h.slot_code || h.parking_slot || '—';
      const feeVal     = h.fee ?? h.amount ?? h.actual_fee ?? h.total_fee ?? 0;
      const isParking  = h.status === 'ACTIVE' || !exitTime;

      return `
        <tr>
          <td><span class="vn-plate" style="font-size:12px;padding:2px 8px">${h.plate_number || '—'}</span></td>
          <td>${isGuest ? '<span class="badge badge-purple">Khách vãng lai</span>' : `<span class="badge badge-primary">${h.user_name || 'Thành viên'}</span>`}</td>
          <td><strong style="color:var(--primary);font-family:'JetBrains Mono',monospace">${slotText}</strong></td>
          <td style="font-size:12.5px;color:var(--text-medium)">${Format.datetime(entryTime)}</td>
          <td style="font-size:12.5px">${exitTime ? Format.datetime(exitTime) : '<span class="badge badge-success">● Đang trong bãi</span>'}</td>
          <td style="font-size:12.5px;font-weight:600">${duration ? Format.duration(duration) : '—'}</td>
          <td style="font-weight:700;color:var(--success);font-size:13.5px">${Format.money(feeVal)}</td>
          <td>
            <div style="display:flex;gap:4px">
              ${h.rfid_uid ? `<span class="badge badge-teal">RFID</span>` : ''}
              ${h.plate_number ? `<span class="badge badge-primary">ANPR</span>` : ''}
            </div>
          </td>
          <td>${isParking ? '<span class="badge badge-success">Đang gửi</span>' : '<span class="badge badge-gray">Hoàn thành</span>'}</td>
          <td style="text-align:right">
            <button class="btn btn-sm btn-outline" onclick="viewHistoryDetail(${globalIdx})">Chi tiết</button>
          </td>
        </tr>
      `;
    }).join('');

    new Pagination({ container: 'history-pager', total, page: currPage, limit, onChange: loadHistory }).render();
  } catch (err) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--error);padding:24px">Lỗi tải dữ liệu: ${err.message}</td></tr>`;
  }
}

function viewHistoryDetail(idx) {
  const h = currentHistoryCache[idx];
  if (!h) return;

  const modal = document.getElementById('history-modal');
  const body = document.getElementById('history-modal-body');
  if (!modal || !body) return;

  const isGuest = h._type === 'guest';
  const entryTime  = h.entry_time;
  const exitTime   = h.exit_time;
  const duration   = h.duration ?? h.actual_minutes ?? h.duration_minutes;
  const slotText   = h.slot_code || h.parking_slot || '—';
  const feeVal     = h.fee ?? h.amount ?? h.actual_fee ?? h.total_fee ?? 0;
  const isParking  = h.status === 'ACTIVE' || !exitTime;

  // Resolve folder and image paths
  const extractFolder = (url) => {
    if (!url) return null;
    const parts = url.split('/').filter(Boolean);
    const idx = parts.indexOf('captures');
    return (idx !== -1 && parts[idx + 1] && parts[idx + 2]) ? parts[idx + 1] : null;
  };
  const folderName = extractFolder(h.entry_image) || extractFolder(h.exit_image) || 'captures_session';
  const inImg = h.entry_image || `/captures/${folderName}/anh_vao.jpg`;
  const outImg = h.exit_image || (exitTime ? `/captures/${folderName}/anh_ra.jpg` : null);

  body.innerHTML = `
    <!-- Top Header -->
    <div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border-light)">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="font-size:36px">🚗</div>
        <div>
          <div style="margin-bottom:4px"><span class="vn-plate" style="font-size:16px;padding:3px 12px">${h.plate_number || '—'}</span></div>
          <div style="font-size:12px;color:var(--text-light)">Vị trí chỗ đỗ: <strong style="color:var(--primary);font-family:'JetBrains Mono',monospace">${slotText}</strong></div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div>${isParking ? '<span class="badge badge-success">● Đang trong bãi</span>' : '<span class="badge badge-gray">Đã hoàn thành</span>'}</div>
          <div style="font-size:11px;color:var(--text-light);margin-top:4px">Mã phiên: #${h.id || '—'}</div>
        </div>
      </div>
      <!-- Folder Path Display -->
      <div style="margin-top:10px;padding:8px 12px;background:#F1F5F9;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px;border:1px solid #E2E8F0">
        <span style="font-size:15px">📁</span>
        <span style="color:var(--text-medium);font-weight:600">Thư mục ảnh (Folder):</span>
        <code style="background:#FFFFFF;border:1px solid #CBD5E1;padding:2px 8px;border-radius:4px;color:#0F172A;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px">${folderName}</code>
      </div>
    </div>

    <!-- 2 ANPR Camera Snapshot Images -->
    <div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"/></svg>
        Hình ảnh camera ANPR đối chiếu (anh_vao.jpg & anh_ra.jpg)
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <!-- Entry Camera Card -->
        <div style="background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:12px;padding:10px;overflow:hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;font-weight:700;color:var(--success);display:flex;align-items:center;gap:4px">
              <span>⬇</span> Cổng Vào (CAM IN)
            </span>
            <span class="badge badge-success" style="font-size:10px;padding:1px 6px">Đã nhận diện</span>
          </div>
          <div style="position:relative;border-radius:8px;overflow:hidden;background:#0F172A;height:175px;display:flex;align-items:center;justify-content:center">
            <img src="${inImg}" alt="Ảnh xe vào" style="width:100%;height:100%;object-fit:cover" onerror="this.onerror=null;this.src='/captures/CAM_IN_36A99999_demo.jpg'">
            <div style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.7);color:#4ADE80;padding:2px 8px;border-radius:4px;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:700">
              ${h.plate_number || 'IN'}
            </div>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;justify-content:space-between">
            <span>Thời gian vào:</span>
            <strong style="color:var(--text-dark)">${Format.datetime(entryTime)}</strong>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;justify-content:space-between">
            <span>Tệp ảnh:</span>
            <code style="color:var(--success);font-weight:700">anh_vao.jpg</code>
          </div>
        </div>

        <!-- Exit Camera Card -->
        <div style="background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:12px;padding:10px;overflow:hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;font-weight:700;color:#2563EB;display:flex;align-items:center;gap:4px">
              <span>⬆</span> Cổng Ra (CAM OUT)
            </span>
            <span class="badge ${isParking ? 'badge-warning' : 'badge-primary'}" style="font-size:10px;padding:1px 6px">
              ${isParking ? 'Chưa ra' : 'Đã đối chiếu'}
            </span>
          </div>
          <div style="position:relative;border-radius:8px;overflow:hidden;background:#0F172A;height:175px;display:flex;align-items:center;justify-content:center">
            ${exitTime && outImg ? `
              <img src="${outImg}" alt="Ảnh xe ra" style="width:100%;height:100%;object-fit:cover" onerror="this.onerror=null;this.src='/captures/CAM_OUT_36A99999_demo.jpg'">
              <div style="position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.7);color:#60A5FA;padding:2px 8px;border-radius:4px;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:700">
                ${h.plate_number || 'OUT'}
              </div>
            ` : `
              <div style="width:100%;height:100%;background:#F1F5F9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#64748B;border:1.5px dashed #CBD5E1;border-radius:8px">
                <div style="font-size:32px;margin-bottom:4px">🅿️</div>
                <div style="font-weight:700;font-size:12.5px;color:var(--text-dark)">Xe đang đỗ trong bãi</div>
                <div style="font-size:11px;color:var(--text-light)">Sẽ chụp ảnh khi xe qua cổng ra</div>
              </div>
            `}
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;justify-content:space-between">
            <span>Thời gian ra:</span>
            <strong style="color:var(--text-dark)">${exitTime ? Format.datetime(exitTime) : '—'}</strong>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;justify-content:space-between">
            <span>Tệp ảnh:</span>
            <code style="color:#2563EB;font-weight:700">anh_ra.jpg</code>
          </div>
        </div>
      </div>
    </div>

    <!-- Metadata Grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#F8FAFC;padding:16px;border-radius:14px;border:1px solid #E2E8F0">
      ${[
        ['Khách hàng', isGuest ? 'Khách vãng lai' : (h.user_name || 'Thành viên')],
        ['Loại phương tiện', Format.vehicleType(h.vehicle_type) || 'Ô tô'],
        ['Thẻ RFID', h.rfid_uid ? `<code style="font-family:'JetBrains Mono',monospace;font-weight:700;background:#E2E8F0;padding:2px 6px;border-radius:4px">${h.rfid_uid}</code>` : 'Nhận diện biển số (ANPR)'],
        ['Thời lượng lưu bãi', duration ? Format.duration(duration) : 'Đang tính...'],
        ['Tổng phí gửi xe', `<strong style="font-size:15px;color:var(--success)">${Format.money(feeVal)}</strong>`],
        ['Trạng thái thanh toán', exitTime ? '<span class="badge badge-success">✓ Đã trừ ví / Thanh toán</span>' : '<span class="badge badge-warning">Đang tính cước</span>']
      ].map(([k, v]) => `
        <div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:2px">${k}</div>
          <div style="font-size:12.5px;font-weight:600">${v}</div>
        </div>
      `).join('')}
    </div>
  `;
  modal.classList.add('open');
}

function closeHistoryModal() {
  document.getElementById('history-modal')?.classList.remove('open');
}
</script>
</body>
</html>
